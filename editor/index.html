<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/api/mana-master/svg/ms-c.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>MTG Card Customizer & Catalog Editor</title>
    <meta name="description" content="View, search, edit, and custom-style Magic: The Gathering cards from your cards.json database. Toggle templates, customize rules, and generate print-ready PNG renders." />
    
    <!--
      Typography:
        Inter / Outfit  — editor chrome UI
        Source Serif 4  — stand-in for Beleren (card names, type lines, P/T).
                          Falls back to real Beleren first if the user has it installed.
        MPlantin        — the actual rules-text face used on printed Magic cards.
                          Declared by mana.css below; no Google download needed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    
    <!-- MTG Mana Symbols Library (served statically from Express backend) -->
    <link rel="stylesheet" href="/api/mana-master/css/mana.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
